name = "moontv-plus"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
minify = true

# 静态资源配置
# Cloudflare Workers Assets 用于服务静态文件
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "moontvplus-db"
database_id = "f77f6a63-08fa-4d49-b3e3-0e8340dbc2c8"

[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"

