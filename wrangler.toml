name = "moontv-plus"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
minify = true

# 静态资源配置
# Cloudflare Workers Assets 用于服务静态文件
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "moontvplus-db"
database_id = "d59db83b-5f8b-4ce7-96d1-a1ce028b9d82"

[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"

